version: '3.9'

services:
  db:
    image: mysql:8.0
    container_name: sabrikom-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: sabrikom
      MYSQL_USER: sabrikom
      MYSQL_PASSWORD: sabrikom_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "sabrikom", "-psabrikom_pass"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sabrikom-api
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=db;Port=3306;Database=sabrikom;User=sabrikom;Password=sabrikom_pass;"
      Jwt__Key: "SabrikomSuperSecretKey2024!ChangeInProduction"
      Jwt__Issuer: "sabrikom-api"
      Jwt__Audience: "sabrikom-app"
      App__BaseUrl: "http://localhost:5000"
      App__FrontendUrl: "http://localhost:4200"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sabrikom-frontend
    restart: unless-stopped
    ports:
      - "4200:4000"
    environment:
      API_URL: "http://api:8080/api"
    depends_on:
      - api

volumes:
  mysql_data:
  uploads_data:
